<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Register')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container page-wrap" style="max-width: 480px;">
    <div class="card">
        <h2 style="margin-top:0;">Create your account</h2>

        <form th:action="@{/register}" th:object="${registerDto}" method="post">
            <div class="grid grid-2">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}"/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}"/>
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" th:field="*{address}" rows="2"></textarea>
            </div>

            <div class="form-group">
                <label for="idProof">ID Proof Number (optional)</label>
                <input type="text" id="idProof" th:field="*{idProof}"/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Register</button>
        </form>

        <p class="mt-16">Already have an account? <a th:href="@{/login}">Login</a></p>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
