<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Admin Dashboard')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container page-wrap">
    <h2 class="section-title" style="margin-top:0;">Admin Dashboard</h2>

    <div class="grid grid-4">
        <div class="card stat-card">
            <div class="value" th:text="${stats.totalRooms}">0</div>
            <div class="label">Total Rooms</div>
        </div>
        <div class="card stat-card">
            <div class="value" th:text="${stats.availableRooms}">0</div>
            <div class="label">Available Rooms</div>
        </div>
        <div class="card stat-card">
            <div class="value" th:text="${stats.occupiedRooms}">0</div>
            <div class="label">Occupied Rooms</div>
        </div>
        <div class="card stat-card">
            <div class="value" th:text="${stats.activeBookings}">0</div>
            <div class="label">Active Bookings</div>
        </div>
        <div class="card stat-card">
            <div class="value" th:text="${stats.todaysCheckIns}">0</div>
            <div class="label">Today's Check-ins</div>
        </div>
        <div class="card stat-card">
            <div class="value" th:text="${stats.todaysCheckOuts}">0</div>
            <div class="label">Today's Check-outs</div>
        </div>
        <div class="card stat-card">
            <div class="value" th:text="${stats.totalGuests}">0</div>
            <div class="label">Total Guests</div>
        </div>
        <div class="card stat-card">
            <div class="value" th:text="'₹' + ${stats.revenue}">₹0</div>
            <div class="label">Revenue</div>
        </div>
    </div>

    <h3 class="section-title">Recent Bookings</h3>
    <div class="card">
        <table>
            <thead>
            <tr><th>ID</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="b : ${stats.recentBookings}">
                <td th:text="${b.id}">1</td>
                <td th:text="${b.guest.firstName} + ' ' + ${b.guest.lastName}">Guest</td>
                <td th:text="${b.room.roomNumber}">101</td>
                <td th:text="${b.checkInDate}">2026-01-01</td>
                <td th:text="${b.checkOutDate}">2026-01-02</td>
                <td><span class="badge" th:classappend="'badge-' + ${b.status}" th:text="${b.status}">CONFIRMED</span></td>
            </tr>
            </tbody>
        </table>
        <p class="muted" th:if="${#lists.isEmpty(stats.recentBookings)}">No bookings yet.</p>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
