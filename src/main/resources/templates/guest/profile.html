<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='My Profile')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container page-wrap" style="max-width:500px;">
    <div class="card">
        <h2 style="margin-top:0;">My Profile</h2>

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

        <form th:action="@{/guest/profile}" th:object="${guest}" method="post">
            <div class="grid grid-2">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}"/>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}"/>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" readonly/>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}"/>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" th:field="*{address}" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label for="idProof">ID Proof Number</label>
                <input type="text" id="idProof" th:field="*{idProof}"/>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
